name: Update Flight Prices
on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests tzdata
      - run: python -u scraper.py
        env:
          IGNAV_API_KEY: ${{ secrets.IGNAV_API_KEY }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add latest_prices.json state.json
          git commit -m "Update flight prices" || echo "No changes"
          git push
